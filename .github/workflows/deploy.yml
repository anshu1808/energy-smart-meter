name: deploy

# Branch → GitHub Environment
# dev  → dev
# qa   → qa
# main → prod
#
# PROD should have:
# GitHub Settings → Environments → prod → Required reviewers

on:
  push:
    branches:
      - dev
      - qa
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment: ${{ github.ref_name == 'main' && 'prod' || github.ref_name }}

    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false

    env:
      TARGET: ${{ github.ref_name == 'main' && 'prod' || github.ref_name }}
      ENV: ${{ github.ref_name == 'main' && 'prod' || github.ref_name }}

      # GitHub Environment variable
      CATALOG: ${{ vars.CATALOG }}

      # GitHub Environment secrets
      DBX_HOST: ${{ secrets.DBX_HOST }}
      DBX_WAREHOUSE_ID: ${{ secrets.DBX_WAREHOUSE_ID }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:

      # ---------------------------------------------------------
      # 1. Checkout
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Python
      # ---------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install databricks-sql-connector databricks-sdk pyyaml

      # ---------------------------------------------------------
      # 3. Validate deployment configuration
      # ---------------------------------------------------------
      - name: Validate deployment configuration
        shell: bash
        run: |
          set -e

          test -n "$DBX_HOST" || {
            echo "ERROR: DBX_HOST is empty"
            exit 1
          }

          test -n "$DBX_WAREHOUSE_ID" || {
            echo "ERROR: DBX_WAREHOUSE_ID is empty"
            exit 1
          }

          test -n "$DATABRICKS_TOKEN" || {
            echo "ERROR: DATABRICKS_TOKEN is empty"
            exit 1
          }

          test -n "$CATALOG" || {
            echo "ERROR: CATALOG is empty"
            exit 1
          }

          echo "DBX_HOST is configured"
          echo "DBX_WAREHOUSE_ID is configured"
          echo "DATABRICKS_TOKEN is configured"
          echo "CATALOG=$CATALOG"
          echo "TARGET=$TARGET"

      # ---------------------------------------------------------
      # 4. Liquibase
      # ---------------------------------------------------------
      - name: Setup Liquibase
        uses: liquibase/setup-liquibase@v3
        with:
          version: "5.0.4"
          edition: "community"

      - name: Install Liquibase extensions
        run: |
          liquibase lpm add liquibase-databricks --global || true
          liquibase lpm add databricks-jdbc --global || true

      # ---------------------------------------------------------
      # 5. Render Liquibase properties
      # ---------------------------------------------------------
      - name: Render liquibase.properties
        working-directory: sql/ddl
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gettext-base >/dev/null

          envsubst < liquibase.properties.template > liquibase.properties

          echo "Liquibase properties rendered."

      # ---------------------------------------------------------
      # DEBUG - Show rendered file
      # ---------------------------------------------------------
      - name: Show rendered liquibase.properties
        working-directory: sql/ddl
        shell: bash
        run: |
          cat liquibase.properties

      - name: Show Liquibase defaults
        working-directory: sql/ddl
        shell: bash
        run: |
          liquibase status --verbose

      # ---------------------------------------------------------
      # 6. Liquibase PLAN
      # ---------------------------------------------------------
      - name: Generate Liquibase plan
        working-directory: sql/ddl
        shell: bash
        run: |
          liquibase updateSQL | tee plan.sql

      # ---------------------------------------------------------
      # 7. DBCR Guard
      # ---------------------------------------------------------
      - name: Run DBCR guard
        shell: bash
        run: |
          python ci/dbcr_guard.py < sql/ddl/plan.sql

        env:
          # Keep destructive operations blocked unless your
          # guard explicitly requires this value for normal execution.
          CONFIRM_DESTRUCTIVE: "false"

      # ---------------------------------------------------------
      # 8. Apply Liquibase changes
      # ---------------------------------------------------------
      - name: Apply Liquibase changesets
        working-directory: sql/ddl
        shell: bash
        run: |
          liquibase update --contexts=all

      # ---------------------------------------------------------
      # 9. Tag Liquibase release
      # ---------------------------------------------------------
      - name: Tag Liquibase release
        working-directory: sql/ddl
        shell: bash
        run: |
          liquibase tag "${TARGET}-${GITHUB_SHA::7}"

      # ---------------------------------------------------------
      # 10. Record DBCR audit
      # ---------------------------------------------------------
      - name: Record DBCR audit rows
        shell: bash
        run: |
          python ci/record_dbcr.py sql/ddl/plan.sql

      # ---------------------------------------------------------
      # 11. Databricks CLI
      # ---------------------------------------------------------
      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main

      # ---------------------------------------------------------
      # 12. Validate Asset Bundle
      # ---------------------------------------------------------
      - name: Validate Databricks Asset Bundle
        shell: bash
        run: |
          databricks bundle validate -t "$TARGET"

      - name: Show Databricks identity
        shell: bash
        run: |
          databricks current-user me

      # ---------------------------------------------------------
      # 13. Deploy Asset Bundle
      # ---------------------------------------------------------
      - name: Deploy Databricks Asset Bundle
        shell: bash
        run: |
          databricks bundle deploy -t "$TARGET"