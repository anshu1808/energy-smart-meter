resources:
  jobs:
    eia_ingestion_job:
      name: eia_ingestion_job

      tasks:
        - task_key: eia_ingestion

          spark_python_task:
            python_file: ${workspace.file_path}/src/ingestion/eia_ingestion.py

          environment_key: default

      environments:
        - environment_key: default

          spec:
            client: "2"