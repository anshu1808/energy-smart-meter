resources:
  jobs:
    master_data_job:
      name: master_data_job

      tasks:
        - task_key: master_data

          spark_python_task:
            python_file: ${workspace.file_path}/src/ingestion/generate_master_data.py

          environment_key: default

      environments:
        - environment_key: default

          spec:
            client: "2"