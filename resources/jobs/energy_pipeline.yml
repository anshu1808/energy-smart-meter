resources:
  jobs:

    energy_pipeline_job:

      name: energy_pipeline_job

      tasks:

        # =====================================
        # INGESTION
        # =====================================

        - task_key: weather_ingestion
          spark_python_task:
            python_file: ${workspace.file_path}/src/ingestion/weather_ingestion.py
            parameters: ["${var.catalog}"]
          environment_key: default

        - task_key: eia_ingestion
          spark_python_task:
            python_file: ${workspace.file_path}/src/ingestion/eia_ingestion.py
            parameters: ["${var.catalog}"]
          environment_key: default

        # =====================================
        # BRONZE
        # =====================================

        - task_key: bronze_meter_readings
          depends_on:
            - task_key: weather_ingestion
            - task_key: eia_ingestion

          spark_python_task:
            python_file: ${workspace.file_path}/src/bronze/bronze_meter_readings.py
            parameters: ["${var.catalog}"]
          environment_key: default

        - task_key: bronze_weather
          depends_on:
            - task_key: weather_ingestion

          spark_python_task:
            python_file: ${workspace.file_path}/src/bronze/bronze_weather.py
            parameters: ["${var.catalog}"]
          environment_key: default

        - task_key: bronze_eia
          depends_on:
            - task_key: eia_ingestion

          spark_python_task:
            python_file: ${workspace.file_path}/src/bronze/bronze_eia.py
            parameters: ["${var.catalog}"]
          environment_key: default

        - task_key: bronze_tariff
          depends_on:
            - task_key: weather_ingestion

          spark_python_task:
            python_file: ${workspace.file_path}/src/bronze/bronze_tariff.py
            parameters: ["${var.catalog}"]
          environment_key: default

        - task_key: bronze_feeder_readings
          depends_on:
            - task_key: bronze_meter_readings

          spark_python_task:
            python_file: ${workspace.file_path}/src/bronze/ingest_feeder_readings.py
            parameters: ["${var.catalog}"]
          environment_key: default

        - task_key: bronze_meter_events
          depends_on:
            - task_key: bronze_meter_readings

          spark_python_task:
            python_file: ${workspace.file_path}/src/bronze/ingest_meter_events.py
            parameters: ["${var.catalog}"]
          environment_key: default

        # =====================================
        # SILVER DIMENSIONS
        # =====================================

        - task_key: dim_customer
          depends_on:
            - task_key: bronze_meter_readings

          spark_python_task:
            python_file: ${workspace.file_path}/src/silver/dim_customer.py
            parameters: ["${var.catalog}"]
          environment_key: default

        - task_key: dim_meter
          depends_on:
            - task_key: bronze_meter_readings

          spark_python_task:
            python_file: ${workspace.file_path}/src/silver/dim_meter.py
            parameters: ["${var.catalog}"]
          environment_key: default

        - task_key: dim_tariff
          depends_on:
            - task_key: bronze_tariff
            - task_key: bronze_meter_readings

          spark_python_task:
            python_file: ${workspace.file_path}/src/silver/dim_tariff.py
            parameters: ["${var.catalog}"]
          environment_key: default

        - task_key: dim_date
          depends_on:
            - task_key: bronze_meter_readings

          spark_python_task:
            python_file: ${workspace.file_path}/src/silver/dim_date.py
            parameters: ["${var.catalog}"]
          environment_key: default

        # =====================================
        # SILVER FACTS
        # =====================================

        - task_key: fact_consumption
          depends_on:
            - task_key: dim_customer
            - task_key: dim_meter
            - task_key: dim_date

          spark_python_task:
            python_file: ${workspace.file_path}/src/silver/fact_consumption.py
            parameters: ["${var.catalog}"]
          environment_key: default

        - task_key: fact_weather
          depends_on:
            - task_key: bronze_weather
            - task_key: dim_date

          spark_python_task:
            python_file: ${workspace.file_path}/src/silver/fact_weather.py
            parameters: ["${var.catalog}"]
          environment_key: default

        - task_key: fact_eia_demand
          depends_on:
            - task_key: bronze_eia
            - task_key: dim_date

          spark_python_task:
            python_file: ${workspace.file_path}/src/silver/fact_eia_demand.py
            parameters: ["${var.catalog}"]
          environment_key: default

        - task_key: fact_billing
          depends_on:
            - task_key: dim_customer
            - task_key: dim_meter
            - task_key: dim_tariff
            - task_key: dim_date
            - task_key: fact_consumption

          spark_python_task:
            python_file: ${workspace.file_path}/src/silver/fact_billing.py
            parameters: ["${var.catalog}"]
          environment_key: default

        - task_key: fact_feeder_readings
          depends_on:
            - task_key: bronze_feeder_readings

          spark_python_task:
            python_file: ${workspace.file_path}/src/silver/fact_feeder_readings.py
            parameters: ["${var.catalog}"]
          environment_key: default

        - task_key: fact_meter_events
          depends_on:
            - task_key: bronze_meter_events

          spark_python_task:
            python_file: ${workspace.file_path}/src/silver/fact_meter_events.py
            parameters: ["${var.catalog}"]
          environment_key: default

        # =====================================
        # GOLD
        # =====================================

        - task_key: gold_revenue_summary
          depends_on:
            - task_key: fact_billing

          spark_python_task:
            python_file: ${workspace.file_path}/src/gold/gold_revenue_summary.py
            parameters: ["${var.catalog}"]
          environment_key: default

        - task_key: gold_peak_load
          depends_on:
            - task_key: fact_consumption

          spark_python_task:
            python_file: ${workspace.file_path}/src/gold/gold_peak_load.py
            parameters: ["${var.catalog}"]
          environment_key: default

        - task_key: gold_theft_detection
          depends_on:
            - task_key: fact_consumption
            - task_key: dim_customer

          spark_python_task:
            python_file: ${workspace.file_path}/src/gold/gold_theft_detection.py
            parameters: ["${var.catalog}"]
          environment_key: default

        - task_key: gold_weather_impact
          depends_on:
            - task_key: fact_consumption
            - task_key: fact_weather

          spark_python_task:
            python_file: ${workspace.file_path}/src/gold/gold_weather_impact.py
            parameters: ["${var.catalog}"]
          environment_key: default

        # =====================================
        # AUDIT
        # =====================================

        - task_key: pipeline_lineage_audit
          depends_on:
            - task_key: bronze_meter_readings
            - task_key: bronze_weather
            - task_key: bronze_eia
            - task_key: bronze_tariff
            - task_key: bronze_feeder_readings
            - task_key: bronze_meter_events
            - task_key: dim_customer
            - task_key: dim_meter
            - task_key: dim_tariff
            - task_key: dim_date
            - task_key: fact_consumption
            - task_key: fact_weather
            - task_key: fact_eia_demand
            - task_key: fact_billing
            - task_key: fact_feeder_readings
            - task_key: fact_meter_events
            - task_key: gold_revenue_summary
            - task_key: gold_peak_load
            - task_key: gold_theft_detection
            - task_key: gold_weather_impact
          run_if: ALL_DONE

          spark_python_task:
            python_file: ${workspace.file_path}/src/audit/pipeline_lineage.py
            parameters: ["${var.catalog}"]
          environment_key: default

      environments:
        - environment_key: default

          spec:
            client: "2"

            dependencies:
              - openpyxl>=3.1.5