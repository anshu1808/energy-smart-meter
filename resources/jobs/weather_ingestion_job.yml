resources:
  jobs:
    weather_ingestion_job:
      name: weather_ingestion_job

      tasks:
        - task_key: weather_ingestion

          spark_python_task:
            python_file: ${workspace.file_path}/src/ingestion/weather_ingestion.py
            parameters: ["${var.catalog}"]

          environment_key: default

      environments:
        - environment_key: default

          spec:
            client: "2"