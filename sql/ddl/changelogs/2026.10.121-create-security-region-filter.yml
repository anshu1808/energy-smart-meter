databaseChangeLog:
  - changeSet:
      id: 2026.10.121-create-security-region-filter
      author: anshu
      labels: ddl,security,function
      context: all
      runInTransaction: false
      comment: "WI-5 Row filter function by region"
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            endDelimiter: ";"
            sql: |
              CREATE OR REPLACE FUNCTION ${energy_catalog}.security.region_filter(region STRING)
              RETURN CASE WHEN is_account_group_member('north_team') THEN region = 'NORTH'
                          WHEN is_account_group_member('south_team') THEN region = 'SOUTH'
                          ELSE TRUE END;
      rollback:
        - sql:
            splitStatements: true
            stripComments: true
            endDelimiter: ";"
            sql: |
              DROP FUNCTION IF EXISTS ${energy_catalog}.security.region_filter;
