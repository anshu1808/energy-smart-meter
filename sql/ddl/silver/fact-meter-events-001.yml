databaseChangeLog:
  - changeSet:
      id: fact-meter-events-001
      author: anshu
      runInTransaction: false
      comment: Baseline existing fact_meter_events table
      labels: silver,baseline
      preConditions:
        - onFail: MARK_RAN
          not:
            - tableExists:
                catalogName: ${energy_catalog}
                schemaName: silver
                tableName: fact_meter_events
      changes:
        - createTable:
            catalogName: ${energy_catalog}
            schemaName: silver
            tableName: fact_meter_events
            columns:
              - column: { name: event_id, type: STRING }
              - column: { name: LCLid, type: STRING }
              - column: { name: event_type, type: STRING }
              - column: { name: severity, type: STRING }
              - column: { name: event_timestamp, type: TIMESTAMP }
              - column: { name: event_date, type: DATE }
              - column: { name: event_hour, type: INT }
              - column: { name: source_system, type: STRING }
              - column: { name: processed_ts, type: TIMESTAMP }
              - column: { name: dq_passed, type: BOOLEAN }
              - column: { name: dq_failed_checks, type: STRING }
              - column: { name: schema_drift_detected, type: BOOLEAN }
              - column: { name: schema_drift_columns, type: STRING }
      rollback:
        - dropTable:
            catalogName: ${energy_catalog}
            schemaName: silver
            tableName: fact_meter_events