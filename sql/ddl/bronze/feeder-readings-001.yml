databaseChangeLog:
  - changeSet:
      id: feeder-readings-001
      author: anshu
      runInTransaction: false
      comment: Baseline existing bronze_feeder_readings table
      labels: bronze,baseline
      preConditions:
        - onFail: MARK_RAN
          not:
            - tableExists:
                catalogName: ${energy_catalog}
                schemaName: bronze
                tableName: bronze_feeder_readings
      changes:
        - createTable:
            catalogName: ${energy_catalog}
            schemaName: bronze
            tableName: bronze_feeder_readings
            columns:
              - column:
                  name: feeder_id
                  type: STRING
              - column:
                  name: substation_id
                  type: STRING
              - column:
                  name: DateTime
                  type: STRING
              - column:
                  name: voltage_v
                  type: DOUBLE
              - column:
                  name: current_a
                  type: DOUBLE
              - column:
                  name: active_power_kw
                  type: DOUBLE
              - column:
                  name: load_ts
                  type: TIMESTAMP
              - column:
                  name: source_system
                  type: STRING
              - column:
                  name: schema_drift_detected
                  type: BOOLEAN
              - column:
                  name: schema_drift_columns
                  type: STRING
              - column:
                  name: dq_passed
                  type: BOOLEAN
              - column:
                  name: dq_failed_checks
                  type: STRING
      rollback:
        - dropTable:
            catalogName: ${energy_catalog}
            schemaName: bronze
            tableName: bronze_feeder_readings