databaseChangeLog:
  - changeSet:
      id: bronze-tariff-001
      author: anshu
      runInTransaction: false
      comment: Baseline existing bronze_tariff table
      labels: bronze,baseline
      preConditions:
        - onFail: MARK_RAN
          not:
            - tableExists:
                catalogName: ${energy_catalog}
                schemaName: bronze
                tableName: bronze_tariff
      changes:
        - createTable:
            catalogName: ${energy_catalog}
            schemaName: bronze
            tableName: bronze_tariff
            columns:
              - column:
                  name: TariffDateTime
                  type: TIMESTAMP
              - column:
                  name: Tariff
                  type: STRING
              - column:
                  name: load_ts
                  type: TIMESTAMP
              - column:
                  name: source_system
                  type: STRING
              - column:
                  name: source_file
                  type: STRING
              - column:
                  name: source_file_name
                  type: STRING
              - column:
                  name: source_file_size
                  type: BIGINT
              - column:
                  name: source_file_modification_time
                  type: TIMESTAMP
              - column:
                  name: schema_drift_detected
                  type: BOOLEAN
              - column:
                  name: schema_drift_columns
                  type: STRING
              - column:
                  name: dq_passed
                  type: BOOLEAN
              - column:
                  name: dq_failed_checks
                  type: STRING
      rollback:
        - dropTable:
            catalogName: ${energy_catalog}
            schemaName: bronze
            tableName: bronze_tariff